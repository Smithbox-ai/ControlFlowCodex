name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    name: Contracts on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Show PowerShell version
        shell: pwsh
        run: $PSVersionTable
      - name: Install Pester
        shell: pwsh
        run: |
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          Install-Module -Name Pester -MinimumVersion 5.0 -Scope CurrentUser -Force -AllowClobber
      - name: Run structural contract suite
        shell: pwsh
        run: ./tests/run-contract-tests.ps1 -UsePester
      - name: Validate eval case schemas
        shell: pwsh
        run: ./evals/run-evals.ps1 -RepoRoot . -ValidateOnly

  # macOS runs on main only (not on every PR), per the Compact vNext CI split.
  validate-macos:
    name: Contracts on macOS
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Show PowerShell version
        shell: pwsh
        run: $PSVersionTable
      - name: Install Pester
        shell: pwsh
        run: |
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          Install-Module -Name Pester -MinimumVersion 5.0 -Scope CurrentUser -Force -AllowClobber
      - name: Run structural contract suite
        shell: pwsh
        run: ./tests/run-contract-tests.ps1 -UsePester
      - name: Validate eval case schemas
        shell: pwsh
        run: ./evals/run-evals.ps1 -RepoRoot . -ValidateOnly
