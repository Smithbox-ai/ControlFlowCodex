name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Semver version to package (e.g. 3.0.0-rc.1). Ignored when triggered by a v* tag."
        required: false
        default: ""

permissions:
  contents: write

jobs:
  cross-os:
    name: Contracts on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Show PowerShell version
        shell: pwsh
        run: $PSVersionTable
      - name: Install Pester
        shell: pwsh
        run: |
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          Install-Module -Name Pester -MinimumVersion 5.0 -Scope CurrentUser -Force -AllowClobber
      - name: Run contract suite
        shell: pwsh
        run: |
          ./tests/run-contract-tests.ps1 -UsePester
          if ($LASTEXITCODE -ne 0) { throw "Contract suite failed: $LASTEXITCODE" }
          ./tests/package.tests.ps1
          if ($LASTEXITCODE -ne 0) { throw "Package roundtrip failed: $LASTEXITCODE" }

  package:
    name: Package and tag
    needs: cross-os
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Show PowerShell version
        shell: pwsh
        run: $PSVersionTable
      - name: Install Pester
        shell: pwsh
        run: |
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          Install-Module -Name Pester -MinimumVersion 5.0 -Scope CurrentUser -Force -AllowClobber
      - name: Run contract suite
        shell: pwsh
        run: |
          ./tests/run-contract-tests.ps1 -UsePester
          if ($LASTEXITCODE -ne 0) { throw "Contract suite failed: $LASTEXITCODE" }
      - name: Resolve version
        id: ver
        shell: pwsh
        run: |
          $manifest = Get-Content plugin.json -Raw | ConvertFrom-Json
          $v = if ($env:INPUT_VERSION -ne '') { $env:INPUT_VERSION } else { $manifest.version }
          if ($env:GITHUB_REF -match 'refs/tags/v(.+)$') { $v = $Matches[1] }
          if ($v -cne $manifest.version) { throw "Release version $v differs from manifest $($manifest.version)" }
          "version=$v" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Output "Resolved version: $v"
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
      - name: Build package
        shell: pwsh
        run: |
          $v = "${{ steps.ver.outputs.version }}"
          ./scripts/package.ps1 -OutputDirectory dist -Version $v
          if ($LASTEXITCODE -ne 0) { throw "Extracted archive smoke failed: $LASTEXITCODE" }
      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: controlflow-codex-${{ steps.ver.outputs.version }}
          path: dist/*.zip
      - name: Create tag (workflow_dispatch only)
        if: ${{ github.event_name == 'workflow_dispatch' }}
        shell: pwsh
        run: |
          $v = "${{ steps.ver.outputs.version }}"
          git tag "v$v"
          if ($LASTEXITCODE -ne 0) { throw "Tag creation failed: $LASTEXITCODE" }
          git push origin "v$v"
          if ($LASTEXITCODE -ne 0) { throw "Tag push failed: $LASTEXITCODE" }
          Write-Output "Pushed tag v$v"
