name: eval

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
    inputs:
      execute_e2e:
        description: "Request native/V4 trials; currently blocked by missing native provenance capabilities"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  deterministic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Portable contracts and hidden grader fixtures
        shell: pwsh
        run: ./tests/run-contract-tests.ps1
      - name: Validate all corpora without model calls
        shell: pwsh
        run: |
          ./evals/run-e2e.ps1 -RepoRoot . -Suite Pilot -ValidateOnly
          ./evals/run-e2e.ps1 -RepoRoot . -Suite Release -ValidateOnly
          ./evals/run-risk-diagnostics.ps1 -RepoRoot . -ValidateOnly

  paired-e2e:
    if: github.event_name == 'workflow_dispatch' && inputs.execute_e2e
    needs: deterministic
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Require supported provenance before CLI installation or authentication
        shell: pwsh
        run: ./evals/run-e2e.ps1 -RepoRoot . -Variant v4 -Collector stdout-jsonl -Execute