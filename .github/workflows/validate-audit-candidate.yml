name: validate-audit-candidate

on:
  push:
    branches: [codex/audit-validation-2026-11-09]

permissions:
  contents: read

jobs:
  contracts:
    name: Audit contracts on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    env:
      CONTROLFLOW_TEST_PROGRESS: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Record checked source and runtime
        shell: pwsh
        run: |
          git rev-parse HEAD
          $PSVersionTable
      - name: Remaining macOS and affected Linux contracts
        env:
          TMPDIR: ${{ runner.temp }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $runner = Get-Content ./tests/run-contract-tests.ps1 -Raw
          $suites = @([regex]::Matches($runner,'(?m)^Invoke-ContractScript "([^"]+)"') | ForEach-Object { $_.Groups[1].Value })
          if ($suites.Count -ne 50 -or $suites[32] -cne 'hooks.tests.ps1') { throw 'Unexpected suite inventory' }
          # The previous immutable run passed the unchanged first 32 suites on
          # macOS and all 50 on Linux. Only hook fixture/CI budgets changed.
          $selected = if ($IsMacOS) {
            @('controlflow-skill-contract.tests.ps1') + $suites[32..49]
          } else {
            @('controlflow-skill-contract.tests.ps1','hooks.tests.ps1','release-workflow.tests.ps1')
          }
          function Invoke-AuditSuite([string]$Name) {
            $clock = [Diagnostics.Stopwatch]::StartNew()
            [Console]::Out.WriteLine("SUITE_START $Name")
            $global:LASTEXITCODE = 0
            & (Join-Path $PWD "tests/$Name")
            if ($LASTEXITCODE -ne 0) { throw "Suite failed: $Name" }
            [Console]::Out.WriteLine("SUITE_PASS $Name elapsed_ms=$($clock.ElapsedMilliseconds)")
          }
          foreach ($suite in $selected) { Invoke-AuditSuite $suite }
          $pwsh = Join-Path $PSHOME 'pwsh'
          & $pwsh -NoProfile -File ./evals/run-e2e.ps1 -RepoRoot . -Suite Pilot -ValidateOnly
          if ($LASTEXITCODE -ne 0) { throw 'Pilot validation failed' }
          & $pwsh -NoProfile -File ./evals/run-e2e.ps1 -RepoRoot . -Suite Release -ValidateOnly
          if ($LASTEXITCODE -ne 0) { throw 'Release validation failed' }
          & $pwsh -NoProfile -File ./evals/run-risk-diagnostics.ps1 -RepoRoot . -ValidateOnly
          if ($LASTEXITCODE -ne 0) { throw 'Diagnostics validation failed' }
